// Added for local/offline FUT operation. Delete this file to revert.
// Read by the config manager at 0x18e2558 (getter 0xb32c30 / GetInt 0xb33d60).
// Absent keys default to 0, which is why each of these read 0 before.

// FUT menu gate - read at 0x0106da6f, needs 1. VERIFIED WORKING: the
// [FUT-GATE] probe reports "FUT_ENABLE_MENU read back as 1".
FUT_ENABLE_MENU=1

// DIME store/config files: 0 = DOWNLOAD them, 1 = use LOCAL copies.
// Set to 0 on 2026-08-10. It had been 1, which contradicts the note
// further down this file: the *local resource names (dimecfglocal /
// storecfglocal / storedesclocal) exist in NO shipped .big, so 1 selects
// a resource that can never load and leaves the store/DIME container
// EMPTY. An empty container is what fifa.exe 0x00cabb83 faults on: it
// does find(id) and the miss branch loads NULL then dereferences it.
// Measured proof: ZERO requests to /dime/ on port 8081 across every run,
// so the catalog was never downloaded at all. With 0 the client should
// fetch dimecfg.xml / storecfg.xml / storedesc-*.xml from DIME_FILES_PATH,
// which fut_dynmsg_stub already serves out of dime_serve_z/.
USE_LOCAL_CFGFILES=0

// Suppress the version-mismatch bit. NOTE: static analysis later showed the
// handler never consults updateRequired, so this is belt-and-braces only.
FUT/OVERRIDE_VERSION=1

// --- NEW: the actual root cause ---
// GameServices::CfgRouting fetches cfgrouting.xml from this URL. At 0xcc12d5
// it does GetString("ROUTINGCFGFILE_URL", "", buf, 0x100), then strlen, then
// `jbe 0xcc137a` - an EMPTY value skips the fetch entirely, which is exactly
// what we observe (no connect, no HTTP, no error, 1b4 stuck at 1 = in flight).
// Point it at our stub. UNPROVEN: that read is a vtable GetString on an object
// we could not resolve statically, so it may not be backed by this ini. If no
// request reaches the stub, the store is different and we look elsewhere.
ROUTINGCFGFILE_URL=http://127.0.0.1:8082/cfgrouting.xml

// --- FUT web API base URLs (recovered from the UNPACKED CardsDLLzf image) ---
// The DLL formats its config keys as:
//     FUT/MODULE_BASEURL_%s   FUT/SINGLE_BASEURL_%s   (SECTION-SCOPED)
//     FUT_RS4_URL_%s          FUT_RS4_APIURL_%s       FUT_RS4_BASE_URL
// We were serving MODULE_BASEURL_* / SINGLE_BASEURL_* over Blaze WITHOUT the
// 'FUT/' prefix, so every lookup missed, the base URL came back empty, and the
// DLL skipped the HTTP call entirely - same empty-string-skip as CfgRouting.
// %s is an uppercase module name; endpoints append e.g. 'ut/auth',
// 'ut/game/ut12/user', which our stub on 8082 already answers.
