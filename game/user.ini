// --- FUT DYNAMIC MESSAGES (the actual cause of [vtbl+0x28]("fut") == -1) ---
// 0xd19be0 builds the message-set URL. At 0xd19bfe it reads
//   ONLINE/FUTDYNAMICMESSAGES_CUSTOMURL via 0xb32c30 - THE LOCAL INI MANAGER,
// the same store user.ini demonstrably feeds (FUT_ENABLE_MENU reads back 1).
// If that key is present it does sprintf("http://%s", value), so the value must
// NOT include a scheme. If absent it falls back to [ebp+0x18] - a DIFFERENT
// config object - which is why patching the hardcoded default at 0x16f7dac
// never produced any traffic on 8081.
// Endpoints appended: "/messages" and "/tutorials" (fut_dynmsg_stub serves both).
ONLINE/FUTDYNAMICMESSAGES_CUSTOMURL=127.0.0.1:8081/onlineAssets/2012/fut
ONLINE/FUTDYNAMICMESSAGES_CUSTOMGETMESSAGESURI=/messages
ONLINE/FUTDYNAMICMESSAGES_TUTORIAL_MSG_URL=/tutorials
ONLINE/FUTDYNAMICMESSAGES_REFRESH_INTERVAL=3600

// --- EA SPORTS WORLD (EASW) ---
// EASW/ENABLED (0x017381a8) is read at 12 sites via 0xb32c30 + 0xb33d60 - the
// SAME local ini manager user.ini is proven to feed (FUT_ENABLE_MENU reads 1).
// Pattern at 0xf4c5a0:
//     cmp byte [0x1a6dfdd],0 / jne skip
//     cmp byte [0x1a6dfdc],0 / jne skip
//     GetInt("EASW/ENABLED") ; cmp eax,1 ; sete al ; je skip
//     -> call 0xcf4270 ; jmp [vtbl+0x28]   (the actual EASW work)
// Must equal exactly 1. Matters here because ConnectToSportsWorld (0x134173d)
// is submitted through the SAME 'trpo' transport (0x6f707274) our dead FUT
// HttpJob was bound to - the dumped transport object literally contained the
// string "ConnectToSportsWorld".
EASW/ENABLED=1

// --- DIME catalog, added 2026-08-10 -------------------------------------
// The *local cfg resource names (dimecfglocal/storecfglocal/storedesclocal)
// do not exist in ANY shipped .big, so USE_LOCAL_CFGFILES=1 selected a
// resource that can never load and left the store/DIME table empty. That
// empty table is what faulted at fifa.exe 0x00cabb83.
// DIME_FILES_PATH is an HTTP prefix (fifa.exe 0xd160a0 -> "DimeDownload"),
// sprintf'd as "%sdimecfg.xml" etc, so it must end with a slash.
DIME_FILES_PATH=http://127.0.0.1:8081/dime/
DIME_IMG_FILES_PATH=http://127.0.0.1:8081/dime/img/
DIMECFG_USE_COMPRESSED=1

